<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff9d;
            --neon-red: #ff0055;
            --dark-bg: #0a0a0f;
            --panel-bg: #13131f;
        }

        body {
            background-color: var(--dark-bg);
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Cyberpunk Card */
        .cyber-card {
            background: var(--panel-bg);
            border: 1px solid #333;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .cyber-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--neon-cyan); opacity: 0.5; transition: opacity 0.3s;
        }
        .cyber-card.correct::before { background: var(--neon-green); opacity: 1; }
        .cyber-card.wrong::before { background: var(--neon-red); opacity: 1; }
        .cyber-card:hover { transform: translateY(-2px); border-color: var(--neon-cyan); }

        /* Exam Option Buttons (New Vertical Layout) */
        .opt-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }
        
        .opt-btn {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #444;
            background: #1a1a24;
            color: #aaa;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 6px;
            text-align: left;
        }
        
        .opt-letter {
            font-weight: bold;
            color: #666;
            min-width: 24px;
            text-align: center;
            border-right: 1px solid #444;
            padding-right: 12px;
        }

        .opt-btn:hover { border-color: var(--neon-cyan); background: #222230; }
        .opt-btn:hover .opt-letter { color: var(--neon-cyan); border-color: var(--neon-cyan); }

        .opt-btn.selected { background: rgba(0, 243, 255, 0.1); border-color: var(--neon-cyan); color: white; }
        .opt-btn.selected .opt-letter { color: var(--neon-cyan); border-color: var(--neon-cyan); }
        
        /* Grading States */
        .opt-btn.correct-ans { background: rgba(0, 255, 157, 0.15); border-color: var(--neon-green); color: white; box-shadow: 0 0 10px rgba(0, 255, 157, 0.2); }
        .opt-btn.correct-ans .opt-letter { color: var(--neon-green); border-color: var(--neon-green); }

        .opt-btn.wrong-ans { background: rgba(255, 0, 85, 0.15); border-color: var(--neon-red); color: white; opacity: 1; }
        .opt-btn.wrong-ans .opt-letter { color: var(--neon-red); border-color: var(--neon-red); }
        
        .opt-btn.dimmed { opacity: 0.4; }

        /* Calculator Key */
        .key {
            display: inline-block; padding: 2px 6px; margin: 0 2px; border-radius: 4px;
            background: #2d2d3a; border-bottom: 2px solid #1a1a24; color: #fff;
            font-family: 'JetBrains Mono', monospace; font-size: 0.85em;
        }
        .key.action { background: #cf3f3f; border-color: #8a1c1c; }

        /* Mode Switch */
        .mode-switch { background: #1a1a24; border: 1px solid #333; padding: 4px; border-radius: 8px; display: flex; gap: 4px; }
        .mode-btn { padding: 6px 16px; border-radius: 4px; font-size: 0.8em; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .mode-btn.active { background: var(--neon-pink); color: white; box-shadow: 0 0 10px rgba(255, 0, 255, 0.4); }
        .mode-btn.inactive { color: #666; }
    </style>
</head>

                id: 50, key: 'd', topic: "Sequence", 
                q: "Harmonic seq -1/2, 1, 1/x, 1/16. Find x.",
                options: { a: "7", b: "8", c: "9", d: "10" },
                ans: "10", soln: "AP reciprocals: -2, 4, 10, 16." 
            }
        ];

        let currentMode = 'review';
        let userAnswers = {};
        let examSubmitted = false;

        const container = document.getElementById('questions-container');
        const examDashboard = document.getElementById('exam-dashboard');
        const scoreDisplay = document.getElementById('score-display');
        const examStatus = document.getElementById('exam-status');
        const submitBtn = document.getElementById('submit-btn');

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-review').className = `mode-btn ${mode === 'review' ? 'active' : 'inactive'}`;
            document.getElementById('btn-exam').className = `mode-btn ${mode === 'exam' ? 'active' : 'inactive'}`;
            
            if (mode === 'exam') {
                examDashboard.classList.remove('hidden');
                renderQuestions();
            } else {
                examDashboard.classList.add('hidden');
                renderQuestions();
            }
        }

        function resetExam() {
            userAnswers = {};
            examSubmitted = false;
            examStatus.innerText = "IN PROGRESS";
            examStatus.classList.replace('text-[#00ff9d]', 'text-yellow-500');
            scoreDisplay.innerText = "--";
            submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            submitBtn.disabled = false;
            renderQuestions();
        }

        function selectOption(qId, option) {
            if (examSubmitted) return;
            userAnswers[qId] = option;
            renderQuestions();
        }

        function submitExam() {
            if (examSubmitted) return;
            examSubmitted = true;
            let score = 0;
            questions.forEach(q => {
                if (userAnswers[q.id] === q.key) score++;
            });
            scoreDisplay.innerText = score;
            examStatus.innerText = "COMPLETED";
            examStatus.classList.replace('text-yellow-500', 'text-[#00ff9d]');
            submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            submitBtn.disabled = true;
            renderQuestions();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuestions() {
            container.innerHTML = '';
            
            questions.forEach(item => {
                const isExam = currentMode === 'exam';
                const userSel = userAnswers[item.id];
                const isCorrect = userSel === item.key;
                
                // Card Styling
                let cardClass = 'cyber-card rounded-lg p-6 flex flex-col gap-4';
                if (isExam && examSubmitted) {
                    if (isCorrect) cardClass += ' correct';
                    else if (userSel) cardClass += ' wrong';
                }

                // Header
                let headerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl font-bold text-gray-700 font-mono">#${item.id}</span>
                            <span class="text-xs text-[#ff00ff] border border-[#ff00ff] px-2 rounded uppercase tracking-wider">${item.topic}</span>
                        </div>
                        ${item.caltech && !isExam ? `<span class="bg-gray-800 border border-[#00f3ff] text-[#00f3ff] text-xs px-2 py-1 rounded font-mono flex items-center gap-1">CALTECH</span>` : ''}
                    </div>
                    <div class="text-lg font-medium text-gray-200">${item.q}</div>
                `;

                // Content Body
                let contentHTML = '';

                if (isExam) {
                    // Exam Mode: Choices as Text Buttons
                    let optsHTML = `<div class="opt-container">`;
                    const keys = ['a', 'b', 'c', 'd'];
                    
                    keys.forEach(key => {
                        let btnClass = 'opt-btn';
                        // Logic for coloring buttons after submit
                        if (examSubmitted) {
                            if (key === item.key) btnClass += ' correct-ans';
                            else if (userSel === key && key !== item.key) btnClass += ' wrong-ans';
                            else btnClass += ' dimmed';
                        } else {
                            if (userSel === key) btnClass += ' selected';
                        }
                        
                        optsHTML += `
                        <div onclick="selectOption(${item.id}, '${key}')" class="${btnClass}">
                            <div class="opt-letter">${key.toUpperCase()}</div>
                            <div class="flex-1">${item.options[key] || "Option " + key.toUpperCase()}</div>
                        </div>`;
                    });
                    optsHTML += `</div>`;
                    contentHTML = optsHTML;

                    // Explanation after submit
                    if (examSubmitted) {
                        contentHTML += `
                            <div class="mt-4 pt-4 border-t border-gray-800 text-sm animate-fade-in">
                                <div class="text-gray-300 bg-gray-900/80 p-3 rounded border-l-2 border-[#00ff9d]">
                                    <div class="text-[#00ff9d] text-xs font-bold mb-1">SOLUTION:</div>
                                    ${item.soln}
                                </div>
                            </div>`;
                    }

                } else {
                    // Review Mode: Answer + Explanation
                    contentHTML = `
                        <div class="mt-2 p-3 bg-black/40 border-l-2 border-yellow-500 text-yellow-500 font-mono text-sm">
                            ANSWER: ${item.ans} <span class="text-gray-500 text-xs ml-2">[Option ${item.key.toUpperCase()}]</span>
                        </div>
                        <button onclick="document.getElementById('soln-${item.id}').classList.toggle('hidden')" 
                            class="mt-auto w-full py-2 bg-[#1f1f2e] hover:bg-[#2d2d3a] text-gray-300 text-sm font-bold uppercase tracking-widest transition-colors border-t border-gray-700 flex justify-center items-center gap-2">
                            <span>View Protocol</span>
                        </button>
                        <div id="soln-${item.id}" class="hidden pt-4 border-t border-gray-800 space-y-4">
                            <div class="text-gray-400 text-sm">
                                <strong class="text-[#00f3ff]">SOLUTION_LOG:</strong><br>
                                <div class="mt-2">${item.soln}</div>
                            </div>
                            ${item.caltech ? `<div class="bg-[#1a1a24] p-3 rounded border border-gray-700 font-mono text-sm text-gray-300 leading-8">${item.caltech}</div>` : ''}
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = cardClass;
                card.innerHTML = headerHTML + contentHTML;
                container.appendChild(card);
            });
            
            // Re-render MathJax
            if(window.MathJax) MathJax.typesetPromise();
        }

        // Initialize
        renderQuestions();
    </script>
</body>
</html>
